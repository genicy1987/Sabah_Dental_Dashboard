<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabah Dental Health KPI Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --surface: #f5f6f8;
  --surface2: #ebedf2;
  --border: #d4d8e1;
  --text: #1a1e2c;
  --text-dim: #5c6478;
  --accent: #2563eb;
  --green: #16a34a;
  --green-dim: rgba(22,163,74,0.1);
  --amber: #ca8a04;
  --amber-dim: rgba(202,138,4,0.1);
  --red: #dc2626;
  --red-dim: rgba(220,38,38,0.08);
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-size:22px; min-height:100vh; overflow-x:hidden; }

.app { position:relative; z-index:1; max-width:1440px; margin:0 auto; padding:24px 28px 48px; }

/* Header */
.header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:32px; flex-wrap:wrap; gap:14px; }
.header h1 { font-family:'Playfair Display',serif; font-weight:900; font-size:42px; letter-spacing:-0.5px; line-height:1.15; color:#1a1e2c; }
.header h1 span { color:var(--accent); }
.header-sub { color:var(--text-dim); font-size:20px; font-weight:300; }
.period-badge { background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:10px 24px; font-size:18px; color:var(--accent); font-weight:500; }
.data-source { font-size:16px; color:var(--text-dim); margin-top:4px; }
.data-source a { color:var(--accent); text-decoration:none; }
.data-source .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }

/* Tabs */
.nav-tabs { display:flex; gap:6px; margin-bottom:28px; overflow-x:auto; padding-bottom:4px; }
.nav-tab { padding:13px 26px; border-radius:8px; font-size:20px; font-weight:500; cursor:pointer;
  border:1px solid transparent; background:transparent; color:var(--text-dim); transition:all 0.2s; white-space:nowrap; }
.nav-tab:hover { color:var(--text); background:var(--surface); }
.nav-tab.active { background:var(--surface); color:var(--accent); border-color:var(--border); font-weight:700; }

/* Cards */
.summary-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-bottom:28px; }
.summary-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:22px 24px; position:relative; overflow:hidden; }
.summary-card::after { content:''; position:absolute; top:0; left:0; width:5px; height:100%; }
.summary-card.green::after { background:var(--green); }
.summary-card.amber::after { background:var(--amber); }
.summary-card.red::after  { background:var(--red); }
.summary-card .label { font-size:17px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-dim); margin-bottom:10px; }
.summary-card .value { font-family:'Playfair Display',serif; font-size:44px; font-weight:700; }
.summary-card .sub   { font-size:17px; color:var(--text-dim); margin-top:6px; }

/* Grid + panels */
.dashboard-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; }
.panel-title { font-size:22px; font-weight:700; margin-bottom:6px; }
.panel-sub { font-size:17px; color:var(--text-dim); margin-bottom:18px; }
.panel.full { grid-column:1/-1; }

/* Heatmap */
.heatmap-table { width:100%; border-collapse:separate; border-spacing:4px; }
.heatmap-table th { font-size:16px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); padding:10px 12px; text-align:center; font-weight:600; }
.heatmap-table th:first-child { text-align:left; }
.heatmap-table td { padding:12px 14px; text-align:center; border-radius:6px; font-size:18px; font-weight:600; }
.heatmap-table td:first-child { text-align:left; font-weight:600; color:var(--text); background:transparent !important; }
.heatmap-table tr:hover td:first-child { color:var(--accent); }
.cell-green { background:var(--green-dim); color:var(--green); }
.cell-amber { background:var(--amber-dim); color:var(--amber); }
.cell-red   { background:var(--red-dim);   color:var(--red); }
.cell-na    { background:rgba(92,100,120,.06); color:var(--text-dim); font-style:italic; }

/* Bars */
.bar-chart { display:flex; flex-direction:column; gap:12px; }
.bar-row { display:flex; align-items:center; gap:14px; }
.bar-label { width:140px; font-size:17px; color:var(--text-dim); text-align:right; flex-shrink:0; }
.bar-track { flex:1; height:34px; background:var(--surface2); border-radius:5px; position:relative; overflow:hidden; }
.bar-fill  { height:100%; border-radius:5px; transition:width .8s ease; }
.bar-target { position:absolute; top:0; height:100%; width:2px; background:var(--text-dim); opacity:.4; }
.bar-value { font-size:17px; font-weight:700; width:75px; text-align:right; flex-shrink:0; }

/* Legend */
.legend { display:flex; gap:20px; margin-bottom:18px; flex-wrap:wrap; }
.legend-item { display:flex; align-items:center; gap:8px; font-size:17px; color:var(--text-dim); }
.legend-dot  { width:14px; height:14px; border-radius:3px; }

/* Loading */
.loading { text-align:center; padding:60px; color:var(--text-dim); }
.loading .spinner { display:inline-block; width:28px; height:28px; border:3px solid var(--border);
  border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:12px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Setup */
.setup-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:32px; max-width:750px; margin:40px auto; }
.setup-box h2 { font-family:'Playfair Display',serif; font-size:32px; margin-bottom:18px; }
.setup-box ol { padding-left:24px; font-size:20px; line-height:2; color:var(--text-dim); }
.setup-box code { background:var(--surface2); padding:3px 10px; border-radius:4px; font-size:18px; color:var(--accent); }
.setup-box button { padding:14px 32px; background:var(--accent); color:#fff; border:none; border-radius:8px;
  font-size:20px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; margin-top:18px; }

/* Responsive */
@media(max-width:900px) { .dashboard-grid { grid-template-columns:1fr; } .header h1 { font-size:32px; } }
@media(max-width:600px) { .app { padding:14px; } .summary-row { grid-template-columns:1fr 1fr; } .nav-tab { padding:10px 16px; font-size:17px; } }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>Kesihatan Pergigian <span>Sabah</span></h1>
      <div class="header-sub">Dashboard Pencapaian KPI — Bahagian Kesihatan Pergigian Negeri Sabah</div>
    </div>
    <div class="period-badge" id="periodBadge">Memuatkan...</div>
  </div>
  <div class="nav-tabs" id="navTabs" style="display:none;"></div>
  <div id="content"><div class="loading"><div class="spinner"></div><br>Memuatkan data...</div></div>
</div>

<script>
// =====================================================================
//  CONFIGURATION — ONLY THING YOU EVER EDIT IN THIS FILE
// =====================================================================
// Paste your Google Sheets published CSV URL here (one-time setup).
// After that, all data changes happen in the spreadsheet.
const SHEET_CSV_URL = '';
// =====================================================================

/*
  SPREADSHEET CONTRACT
  ====================
  The "Data" sheet must follow this structure:

  Row 1:  Title (ignored)
  Row 2:  "Suku Tahun: Jan - Mac 2026"  ← period label, read by dashboard
  Row 3:  blank
  Row 4:  header row: "KPI / Daerah", KK, SDN, TWU, KGU, KDT, BFT, KB, LD, PP, SBH
  Row 5:  full district names (ignored)
  Row 6+: data rows

  SECTION HEADERS — any row whose first cell is ALL-CAPS and contains no
  numbers becomes a section header.  Examples:
      IBU MENGANDUNG
      TODDLER
      PRASEKOLAH / TADIKA
      OKU              ← you can add this, dashboard will auto-create a tab

  KPI ROWS — any non-section, non-blank row under a section.
    Column A: KPI label (e.g. "% Kedatangan Baru")
    Columns B-K: numeric values per district (KK..SBH)

  SASARAN ROWS — if the row immediately after a KPI row starts with
  "  Sasaran" (leading spaces), it's read as the POA target for that KPI.

  INVERTED KPIs — if the KPI label contains "Unmet", the dashboard
  treats lower values as better (green) and higher as worse (red).

  SPECIAL ROWS — rows starting with "  " (2+ leading spaces) that are
  NOT sasaran rows are ignored (e.g. age headers for Warga Emas).
*/

// =================== CONSTANTS ===================
const DCOLS  = ['KK','SDN','TWU','KGU','KDT','BFT','KB','LD','PP','SBH'];
const DNAMES = {KK:'Kota Kinabalu',SDN:'Sandakan',TWU:'Tawau',KGU:'Keningau',
  KDT:'Kudat',BFT:'Beaufort',KB:'Kota Belud',LD:'Lahad Datu',PP:'Penampang',SBH:'SABAH'};

// =================== STATE ===================
let SECTIONS = [];   // [{id, name, kpis:[{label, values:{KK:…}, target, inverted, isCount}]}]
let PERIOD = '';
let SOURCE = 'none';

// =================== CSV PARSER ===================
function parseCSV(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const cells = []; let cur = '', inQ = false;
    for (const ch of line) {
      if (ch === '"') inQ = !inQ;
      else if (ch === ',' && !inQ) { cells.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    cells.push(cur.trim());
    return cells;
  });
}

function isSectionHeader(label) {
  if (!label || label.startsWith(' ')) return false;
  // All-caps, may contain / and spaces, no digits
  return /^[A-Z\s\/\-()]+$/.test(label) && label.length > 2;
}

function parseSheet(rows) {
  SECTIONS = [];
  // Period from row 2
  if (rows[1] && rows[1][0]) {
    PERIOD = rows[1][0].replace(/Suku Tahun:\s*/i, '').trim() || 'Q1 2026';
  }

  let currentSection = null;
  let lastKpi = null;

  for (let i = 3; i < rows.length; i++) {
    const row = rows[i];
    if (!row || !row[0]) continue;
    const label = row[0];

    // Skip district name row
    if (label === '' || label === 'KPI / Daerah') continue;

    // Sasaran row?
    if (/^\s{2,}Sasaran/.test(label) && lastKpi) {
      // Find first non-empty numeric value as the target
      for (let c = 1; c <= 10; c++) {
        const v = parseFloat(row[c]);
        if (!isNaN(v)) { lastKpi.target = v; break; }
      }
      continue;
    }

    // Other indented rows → skip
    if (/^\s{2,}/.test(label)) continue;

    // Section header?
    if (isSectionHeader(label)) {
      currentSection = { id: label.toLowerCase().replace(/[\s\/]+/g, '_'), name: label, kpis: [] };
      SECTIONS.push(currentSection);
      lastKpi = null;
      continue;
    }

    // KPI data row
    if (!currentSection) continue;

    const vals = {};
    let hasAny = false;
    for (let c = 0; c < DCOLS.length; c++) {
      const raw = row[c + 1];
      if (raw !== undefined && raw !== '' && !isNaN(parseFloat(raw))) {
        vals[DCOLS[c]] = parseFloat(raw);
        hasAny = true;
      }
    }
    if (!hasAny) continue;

    const inverted = /unmet/i.test(label);
    const isCount = /jumlah|bilangan/i.test(label);

    const kpi = { label, values: vals, target: null, inverted, isCount };
    currentSection.kpis.push(kpi);
    lastKpi = kpi;
  }
}

// =================== FALLBACK DATA ===================

      {label:'Jumlah Kedatangan Baru', values:{KK:2953,SDN:2388,TWU:1959,KGU:1298,KDT:1510,BFT:765,KB:717,LD:1272,PP:603,SBH:13465}, isCount:true},
      {label:'Purata dft', values:{KK:0.65,SDN:0.89,TWU:0.92,KGU:1.23,KDT:0.58,BFT:0.86,KB:1.39,LD:0.87,PP:1.03,SBH:0.87}},
      {label:'% TPR', values:{KK:85.6,SDN:83.2,TWU:84.3,KGU:78.0,KDT:89.8,BFT:84.3,KB:72.7,LD:82.7,PP:80.4,SBH:83.5}},
      {label:'% MBK', values:{KK:85.7,SDN:82.4,TWU:84.5,KGU:78.0,KDT:89.2,BFT:84.3,KB:72.9,LD:82.7,PP:80.8,SBH:83.3}}
    ]},

      {label:'% Liputan Sekolah', values:{KK:49.1,SDN:22.6,TWU:29.1,KGU:26.1,KDT:76.4,BFT:25.9,KB:21.2,LD:30.6,PP:26.5,SBH:32.6}},
      {label:'% Liputan Pelajar', values:{KK:23.7,SDN:66.6,TWU:44.5,KGU:72.4,KDT:65.9,BFT:65.2,KB:61.6,LD:47.1,PP:3.8,SBH:52.3}},
      {label:'Jumlah Kedatangan Baru', values:{KK:259,SDN:1000,TWU:604,KGU:626,KDT:1077,BFT:301,KB:604,LD:329,PP:24,SBH:4824}, isCount:true},
      {label:'Purata dfx', values:{KK:3.19,SDN:4.33,TWU:5.04,KGU:4.36,KDT:2.6,BFT:4.09,KB:4.05,LD:5.16,PP:4.33,SBH:3.98}},
      {label:'% Kes Selesai (KS)', values:{KK:57.1,SDN:90.1,TWU:54.3,KGU:79.2,KDT:65.2,BFT:94.0,KB:66.9,LD:46.8,PP:54.2,SBH:71.1}},
      {label:'% MBK', values:{KK:30.9,SDN:36.8,TWU:27.2,KGU:24.4,KDT:51.1,BFT:40.2,KB:29.8,LD:28.0,PP:45.8,SBH:35.6}},
      {label:'% Unmet Treatment Need', values:{KK:65.3,SDN:16.1,TWU:63.7,KGU:30.7,KDT:72.8,BFT:10.3,KB:50.4,LD:75.4,PP:84.6,SBH:47.0}, inverted:true}
    ]},
    {name:'SEKOLAH RENDAH', kpis:[
      {label:'% Liputan Pelajar', values:{KK:98.5,SDN:99.0,TWU:98.7,KGU:98.9,KDT:98.7,BFT:97.8,KB:98.1,LD:98.4,PP:99.1,SBH:98.6}},
      {label:'Jumlah Kedatangan Baru', values:{KK:2575,SDN:2308,TWU:305,KGU:2782,KDT:1410,BFT:1034,KB:2868,LD:361,PP:1208,SBH:14851}, isCount:true},
      {label:'Purata DMFT', values:{KK:0.54,SDN:0.85,TWU:0.97,KGU:0.59,KDT:0.52,BFT:0.49,KB:0.43,LD:0.89,PP:0.38,SBH:0.58}},
      {label:'% TPR', values:{KK:41.0,SDN:30.8,TWU:30.8,KGU:39.3,KDT:68.8,BFT:39.0,KB:35.6,LD:24.7,PP:39.0,SBH:39.8}, target:65},
      {label:'% MBG', values:{KK:91.9,SDN:82.7,TWU:89.2,KGU:95.5,KDT:95.2,BFT:92.9,KB:66.7,LD:78.1,PP:88.4,SBH:86.0}, target:80},
      {label:'% Unmet Treatment Need', values:{KK:49.1,SDN:13.8,TWU:10.9,KGU:21.4,KDT:44.8,BFT:11.4,KB:38.7,LD:33.5,PP:44.8,SBH:30.8}, target:30, inverted:true},
      {label:'% Rawatan Preventif', values:{KK:92.8,SDN:90.5,TWU:96.7,KGU:97.9,KDT:93.5,BFT:97.7,KB:93.7,LD:63.0,PP:86.2,SBH:93.3}}
    ]},
    {name:'SEKOLAH MENENGAH', kpis:[
      {label:'% Liputan Sekolah', values:{SDN:6,KDT:33,BFT:9,SBH:3}},
      {label:'% Liputan Pelajar', values:{SDN:93.9,KDT:96.0,BFT:99.4,SBH:95.9}},
      {label:'Jumlah Kedatangan Baru', values:{SDN:1774,KDT:1574,BFT:1054,SBH:4402}, isCount:true},
      {label:'Purata DMFT', values:{SDN:1.81,KDT:1.96,BFT:1.34,SBH:1.75}},
      {label:'% TPR', values:{SDN:52.8,KDT:64.3,BFT:60.2,SBH:58.7}, target:75},
      {label:'% Unmet Treatment Need', values:{SDN:87.0,KDT:59.3,BFT:38.9,SBH:67.3}, target:55, inverted:true}
    ]},
    {name:'DEWASA', kpis:[
      {label:'Jumlah Kedatangan Baru', values:{KK:9503,SDN:9153,TWU:7795,KGU:6698,KDT:5202,BFT:3785,KB:4125,LD:2249,PP:3258,SBH:51768}, isCount:true},
      {label:'% Saringan Kanser Mulut', values:{KK:97.4,SDN:99.5,TWU:95.6,KGU:98.3,KDT:99.7,BFT:99.3,KB:99.1,LD:99.7,PP:92.3,SBH:97.9}, target:98}
    ]},
    {name:'WARGA EMAS', kpis:[
      {label:'% ≥20 Gigi (mengikut umur)', values:{KK:37.8,SDN:33.6,TWU:30.9,KGU:27.0,KDT:24.1,BFT:13.8,SBH:27.4}}
    ]}
  ];
  SECTIONS = fb.map(s => ({
    id: s.name.toLowerCase().replace(/[\s\/]+/g,'_'),
    name: s.name,
    kpis: s.kpis.map(k => ({...k, target:k.target||null, inverted:!!k.inverted, isCount:!!k.isCount}))
  }));
  PERIOD = 'Jan — Mac 2026';
}

// =================== LOAD ===================
async function loadData() {
  if (SHEET_CSV_URL) {
    try {
      const r = await fetch(SHEET_CSV_URL);
      if (!r.ok) throw new Error(r.status);
      parseSheet(parseCSV(await r.text()));
      SOURCE = 'live';
    } catch(e) {
      console.warn('Sheet load failed, using fallback:', e);
      loadFallback(); SOURCE = 'fallback';
    }
  } else {
    loadFallback(); SOURCE = 'fallback';
  }
  bootUI();
}

// =================== UI BOOTSTRAP ===================
function bootUI() {
  // Status
  const ds = document.getElementById('dataSourceStatus');
  ds.innerHTML = SOURCE === 'live'
    ? `<span class="dot" style="background:var(--green)"></span>Data langsung dari Google Sheets`
    : `<span class="dot" style="background:var(--red)"></span>Data tempatan — <a href="#" onclick="showSetup();return false;">sambung ke Google Sheets</a>`;
  document.getElementById('periodBadge').textContent = PERIOD;

  // Build tabs dynamically
  const navEl = document.getElementById('navTabs');
  navEl.style.display = 'flex';
  navEl.innerHTML = `<div class="nav-tab active" data-view="__overview">Ringkasan Negeri</div>`
    + SECTIONS.map(s => `<div class="nav-tab" data-view="${s.id}">${s.name}</div>`).join('');

  navEl.addEventListener('click', e => {
    const tab = e.target.closest('.nav-tab');
    if (!tab) return;
    navEl.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const v = tab.dataset.view;
    if (v === '__overview') renderOverview();
    else { const sec = SECTIONS.find(s => s.id === v); if (sec) renderSection(sec); }
  });

  renderOverview();
}

// =================== HELPERS ===================
function statusCls(val, target, inv) {
  if (val == null) return 'cell-na';
  if (!target) return 'cell-na';
  if (inv) {
    // Inverted: lower is better (e.g. Unmet Treatment Need)
    // Below target = green, near target = amber, above target = red
    if (val <= target) return 'cell-green';
    if (val <= target * 1.3) return 'cell-amber';
    return 'cell-red';
  }
  // Normal: higher is better
  const ratio = val / target;
  if (ratio >= 0.9) return 'cell-green';
  if (ratio >= 0.7) return 'cell-amber';
  return 'cell-red';
}
function barCol(cls) {
  if (cls === 'cell-green') return 'var(--green)';
  if (cls === 'cell-amber') return 'var(--amber)';
  if (cls === 'cell-red')   return 'var(--red)';
  return 'var(--accent)';
}
function fP(v) { return v != null ? v.toFixed(1) + '%' : '—'; }
function fI(v) { return v != null ? v.toLocaleString() : '—'; }
function fD(v) { return v != null ? v.toFixed(2) : '—'; }
function fmtVal(kpi, v) {
  if (v == null) return '—';
  if (kpi.isCount) return fI(v);
  if (kpi.label.match(/purata|mean|dmft|dft|dfx/i)) return fD(v);
  return fP(v);
}

// Which districts have data for a KPI
function activeDists(kpi) {
  return DCOLS.slice(0, 9).filter(d => kpi.values[d] != null);
}

// Auto-detect a reasonable max for bar charts
function autoMax(kpi) {
  if (kpi.isCount) {
    const mx = Math.max(...Object.values(kpi.values).filter(v => v != null));
    return mx * 1.15;
  }
  if (kpi.label.match(/purata|mean|dmft|dft|dfx/i)) {
    return Math.max(...Object.values(kpi.values).filter(v => v != null)) * 1.3;
  }
  return 100;
}

// =================== OVERVIEW ===================
function renderOverview() {
  const el = document.getElementById('content');
  // Summary cards: first KPI of each section that has a target, or the first % KPI
  let cards = [];
  SECTIONS.forEach(sec => {
    const kpi = sec.kpis.find(k => k.target) || sec.kpis.find(k => k.label.startsWith('%')) || sec.kpis[0];
    if (!kpi) return;
    const v = kpi.values.SBH;
    let status = 'amber';
    if (kpi.target) {
      const cls = statusCls(v, kpi.target, kpi.inverted);
      status = cls === 'cell-green' ? 'green' : cls === 'cell-red' ? 'red' : 'amber';
    }
    cards.push({
      label: sec.name, value: fmtVal(kpi, v), status,
      sub: kpi.label + (kpi.target ? ` — Sasaran: ${kpi.target}` : '')
    });
  });

  let html = `<div class="summary-row">${cards.map(c => `
    <div class="summary-card ${c.status}">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="sub">${c.sub}</div>
    </div>`).join('')}</div>`;

  // Heatmap: only KPIs that have targets
  const targetKpis = [];
  SECTIONS.forEach(sec => {
    sec.kpis.filter(k => k.target).forEach(k => {
      targetKpis.push({ section: sec.name, kpi: k });
    });
  });

  if (targetKpis.length > 0) {
    html += `<div class="panel full" style="margin-bottom:16px;overflow-x:auto;">
      <div class="panel-title">Heatmap Prestasi Daerah</div>
      <div class="panel-sub">Hanya KPI yang mempunyai sasaran POA dipaparkan</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Tercapai (≥90%)</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div>Hampir (70-90%)</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Belum Tercapai (<70%)</div>
      </div>
      <table class="heatmap-table">
      <tr><th>Daerah</th>${targetKpis.map(tk => `<th>${tk.section}<br>${tk.kpi.label}</th>`).join('')}</tr>
      ${[...DCOLS.slice(0,9), 'SBH'].map(d => {
        const name = d === 'SBH' ? '<strong>SABAH</strong>' : DNAMES[d];
        const wrap = d === 'SBH' ? v => `<strong>${v}</strong>` : v => v;
        return `<tr><td>${name}</td>${targetKpis.map(tk => {
          const v = tk.kpi.values[d];
          const cls = statusCls(v, tk.kpi.target, tk.kpi.inverted);
          return `<td class="${cls}">${wrap(fmtVal(tk.kpi, v))}</td>`;
        }).join('')}</tr>`;
      }).join('')}
      </table></div>`;
  }

  // Auto-generated issues: KPIs where SBH is red
  const issues = [];
  SECTIONS.forEach(sec => {
    sec.kpis.forEach(kpi => {
      if (!kpi.target) return;
      const cls = statusCls(kpi.values.SBH, kpi.target, kpi.inverted);
      if (cls === 'cell-red') {
        // Find worst district
        const dists = activeDists(kpi);
        let worst = dists[0], worstV = kpi.values[dists[0]];
        dists.forEach(d => {
          const v = kpi.values[d];
          if (v == null) return;
          if (kpi.inverted ? v > worstV : v < worstV) { worst = d; worstV = v; }
        });
        issues.push({
          title: `${sec.name}: ${kpi.label} = ${fmtVal(kpi, kpi.values.SBH)}`,
          desc: `Sasaran: ${kpi.target}. Daerah paling rendah: ${DNAMES[worst]} (${fmtVal(kpi, worstV)})`,
          color: 'red'
        });
      } else if (cls === 'cell-amber') {
        issues.push({
          title: `${sec.name}: ${kpi.label} = ${fmtVal(kpi, kpi.values.SBH)}`,
          desc: `Hampir sasaran (${kpi.target}) tetapi belum tercapai`,
          color: 'amber'
        });
      }
    });
  });

  if (issues.length > 0) {
    html += `<div class="panel full">
      <div class="panel-title" style="color:var(--red);">Isu — KPI Belum Mencapai Sasaran</div>
      <div class="panel-sub">Dijana automatik berdasarkan sasaran POA</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;">
        ${issues.map(iss => `
          <div style="padding:12px;background:var(--${iss.color}-dim);border-radius:8px;border-left:3px solid var(--${iss.color});">
            <div style="font-size:18px;font-weight:700;color:var(--${iss.color});margin-bottom:6px;">${iss.title}</div>
            <div style="font-size:17px;color:var(--text-dim);">${iss.desc}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  el.innerHTML = html;
}

// =================== GENERIC SECTION RENDERER ===================
function renderSection(sec) {
  const el = document.getElementById('content');

  // Check data completeness
  const allDists = DCOLS.slice(0, 9);
  const firstKpi = sec.kpis[0];
  const coveredDists = firstKpi ? activeDists(firstKpi) : [];
  const incomplete = coveredDists.length < 9 && coveredDists.length > 0;

  let html = '';

  // Incompleteness warning
  if (incomplete) {
    const missing = allDists.filter(d => !coveredDists.includes(d)).map(d => DNAMES[d]);
    html += `<div style="padding:16px;background:var(--amber-dim);border:1px solid var(--amber);border-radius:var(--radius);margin-bottom:24px;font-size:20px;">
      <strong style="color:var(--amber)">Data Tidak Lengkap:</strong> Hanya ${coveredDists.length} daripada 9 daerah mempunyai data. Tiada data: ${missing.join(', ')}.
    </div>`;
  }

  // Summary cards — SBH value for each KPI
  html += `<div class="summary-row">${sec.kpis.map(kpi => {
    const v = kpi.values.SBH;
    let status = 'amber';
    if (kpi.target) {
      const cls = statusCls(v, kpi.target, kpi.inverted);
      status = cls === 'cell-green' ? 'green' : cls === 'cell-red' ? 'red' : 'amber';
    }
    return `<div class="summary-card ${status}">
      <div class="label">${kpi.label}</div>
      <div class="value">${fmtVal(kpi, v)}</div>
      ${kpi.target ? `<div class="sub">Sasaran: ${kpi.target}</div>` : ''}
    </div>`;
  }).join('')}</div>`;

  // Bar charts — one panel per non-count KPI
  const barKpis = sec.kpis.filter(k => !k.isCount);
  html += `<div class="dashboard-grid">`;

  barKpis.forEach(kpi => {
    const dists = activeDists(kpi);
    const mx = autoMax(kpi);
    html += `<div class="panel">
      <div class="panel-title">${kpi.label}</div>
      ${kpi.target ? `<div class="panel-sub">Sasaran: ${kpi.target}${kpi.inverted ? ' (semakin rendah semakin baik)' : ''}</div>` : '<div class="panel-sub"></div>'}
      <div class="bar-chart">
        ${dists.map(d => {
          const v = kpi.values[d];
          if (v == null) return '';
          const pct = Math.min((v / mx) * 100, 100);
          const cls = kpi.target ? statusCls(v, kpi.target, kpi.inverted) : 'cell-na';
          const col = kpi.target ? barCol(cls) : 'var(--accent)';
          return `<div class="bar-row">
            <div class="bar-label">${DNAMES[d] || d}</div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%;background:${col};"></div>
              ${kpi.target ? `<div class="bar-target" style="left:${Math.min((kpi.target / mx) * 100, 100)}%"></div>` : ''}
            </div>
            <div class="bar-value" style="color:${col}">${fmtVal(kpi, v)}</div>
          </div>`;
        }).join('')}
      </div>
      ${kpi.target ? `<div style="margin-top:10px;font-size:16px;color:var(--text-dim);">Garis kelabu = Sasaran (${kpi.target})</div>` : ''}
    </div>`;
  });

  html += `</div>`;
  el.innerHTML = html;
}

// =================== INIT ===================
try {
  loadData();
} catch(err) {
  document.getElementById('content').innerHTML =
    '<div style="padding:40px;color:red;font-size:18px;">'
    + '<strong>Dashboard Error:</strong><br>' + err.message
    + '<br><br><pre>' + err.stack + '</pre></div>';
}
window.onerror = function(msg, url, line, col, err) {
  document.getElementById('content').innerHTML =
    '<div style="padding:40px;color:red;font-size:18px;">'
    + '<strong>JS Error:</strong> ' + msg
    + '<br>Line: ' + line + ', Col: ' + col
    + (err ? '<br><pre>' + err.stack + '</pre>' : '') + '</div>';
};
